[project]
name = "lighting-brain-mvp"
version = "0.1.0"
description = "MVP for converting music analysis into lighting timelines."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = [
  "librosa",
  "aubio",
  "sounddevice",
]

[project.scripts]
lighting-brain = "lighting_brain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighting_brain"]
