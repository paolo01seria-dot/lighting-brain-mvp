[project]
name = "lighting-brain-mvp"
version = "0.1.0"
description = "MVP for converting music analysis into lighting timelines."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = [
  "librosa",
  "numpy",
  "scipy",
  "soundfile",
  "sounddevice",
]
realtime = [
  "numpy",
  "sounddevice",
]
aubio = [
  "aubio",
]

[project.scripts]
lighting-brain = "lighting_brain.cli:main"
lighting-audio-analyze = "lighting_brain.audio_cli:main"
lighting-harmonix-import = "lighting_brain.harmonix_cli:main"
lighting-live-audio = "lighting_brain.live_audio_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lighting_brain"]
