<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lighting Brain</title>
    <link rel="stylesheet" href="styles.css?v=20260601-2">
    <style>
      :root { color-scheme: dark; --bg: #111315; --panel: #1a1e21; --panel-2: #20262a; --line: #303940; --text: #edf2f4; --muted: #9aa7ad; --accent: #4fc3b1; --danger: #ff5c65; --radius: 8px; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; overflow: auto; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, input, select { font: inherit; }
      .app-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      .topbar { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; align-items: start; gap: 16px; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: #15181a; }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #ff4f62 0 25%, #ffc857 25% 50%, #30c5ff 50% 75%, #f5f7f8 75%); }
      h1 { margin: 0; font-size: 18px; font-weight: 720; }
      p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
      .controls { display: flex; align-items: end; justify-content: flex-start; gap: 10px; flex-wrap: wrap; min-width: 0; }
      label, .file-control { display: grid; gap: 6px; min-width: 150px; width: 150px; flex: 0 0 150px; }
      label span, .file-control span { color: var(--muted); font-size: 12px; }
      select, .number-control input, .file-control, button { min-height: 38px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--text); }
      select { width: 100%; padding: 0 34px 0 10px; }
      .file-control { position: relative; display: flex; align-items: center; justify-content: center; width: 144px; flex-basis: 144px; padding: 0 12px; cursor: pointer; background: #263034; border-color: #3b484e; }
      .file-control span { color: var(--text); font-weight: 620; }
      .file-control input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
      .number-control { min-width: 92px; width: 92px; flex-basis: 92px; }
      .number-control input { width: 92px; padding: 0 10px; }
      .range-control { min-width: 180px; width: 180px; flex-basis: 180px; }
      .range-control input { accent-color: var(--accent); height: 38px; }
      .range-control span { display: flex; justify-content: space-between; gap: 10px; }
      .transport { display: flex; gap: 8px; width: 156px; flex: 0 0 156px; }
      .training-switch { min-width: 84px; width: 84px; flex-basis: 84px; margin-left: 8px; }
      .training-switch input { width: 22px; height: 22px; accent-color: var(--accent); }
      .training-duration-control { min-width: 96px; width: 96px; flex-basis: 96px; }
      .audio-device-summary-control { min-width: 180px; width: 180px; flex-basis: 180px; }
      .audio-device-summary-control output { display: flex; min-height: 38px; align-items: center; padding: 0 10px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #172023; color: var(--text); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .sample-control { min-width: 220px; width: 220px; flex-basis: 220px; }
      .sample-control input { min-height: 38px; width: 100%; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--text); }
      button { padding: 0 15px; cursor: pointer; }
      button:disabled { color: #6e777c; cursor: not-allowed; }
      #playButton:not(:disabled) { background: #1f4f47; border-color: #367b70; }
      #stopButton:not(:disabled) { background: #4f2529; border-color: #793941; }
      .mini-player { grid-column: 1 / -1; display: grid; grid-template-columns: 44px 38px minmax(240px, 1fr) 44px; align-items: center; gap: 10px; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
      .review-play-button { width: 38px; min-height: 34px; padding: 0; font-size: 14px; }
      .hidden-seek { display: none; }
      .tester-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 560px; }
      .meter-panel { padding: 20px; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
      .status-row { display: flex; justify-content: space-between; gap: 18px; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .status-row span { color: var(--muted); }
      .status-row strong { text-align: right; font-size: 14px; }
      .meter { height: 12px; margin: 20px 0; overflow: hidden; border-radius: 999px; background: #0d0f10; border: 1px solid var(--line); }
      #energyFill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #ffc857, var(--danger)); }
      .track-overview, .live-spectrum, .event-log { border: 1px solid var(--line); border-radius: var(--radius); background: #0d1011; }
      .track-overview, .live-spectrum { display: block; width: 100%; height: 156px; margin: 0 0 16px; }
      .event-log { height: 180px; overflow: hidden; padding: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; white-space: pre-wrap; }
      .metadata-panel { margin: 0 0 16px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #101315; }
      .metadata-panel h3 { margin: 0 0 10px; font-size: 13px; }
      .metadata-panel dl { display: grid; gap: 7px; margin: 0; }
      .metadata-panel div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; }
      .metadata-panel dt { color: var(--muted); font-size: 12px; }
      .metadata-panel dd { margin: 0; overflow: hidden; color: var(--text); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .stage-panel { display: grid; grid-template-rows: auto auto minmax(420px, 1fr); gap: 10px; padding: 22px; min-width: 0; min-height: 560px; }
      .stage-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .stage-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
      .cue-editor { display: grid; grid-template-columns: minmax(130px, 1fr) 72px; gap: 8px; min-width: 220px; }
      .cue-editor label { min-width: 0; width: auto; }
      .cue-editor input { min-height: 34px; width: 100%; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-2); color: var(--text); }
      .cue-editor input:disabled { color: #6e777c; background: #15191b; }
      .stage-toolbar h2 { margin: 0; font-size: 16px; }
      .training-summary { min-height: 24px; color: var(--muted); font-size: 12px; }
      .stage { position: relative; overflow: hidden; min-height: 420px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px), radial-gradient(circle at 50% 8%, rgba(79,195,177,.12), transparent 34%), #0c0f10; background-size: 48px 48px, 48px 48px, auto, auto; }
      .stage-depth { position: absolute; left: 7%; right: 7%; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; pointer-events: none; }
      .stage-label { position: absolute; z-index: 1; display: none; color: rgba(237,242,244,.38); font-size: 10px; line-height: 1; pointer-events: none; }
      .is-training-edit .stage-label { display: block; }
      .stage-label-middle { left: 8px; top: 50%; transform: translateY(-50%); }
      .stage-label-centre { left: 50%; top: 8px; transform: translateX(-50%); }
      .stage-label-left { left: 25%; top: 8px; transform: translateX(-50%); }
      .stage-label-right { right: 25%; top: 8px; transform: translateX(50%); }
      .stage-label-up { left: 8px; top: 8px; }
      .stage-label-down { left: 8px; bottom: 8px; }
      .depth-back { top: 12%; height: 18%; } .depth-mid { top: 36%; height: 24%; } .depth-front { bottom: 8%; height: 28%; }
      .light { position: absolute; display: block; width: 54px; height: 54px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: radial-gradient(circle at 50% 48%, rgba(255,255,255,.2) 0 10%, rgba(255,255,255,.07) 11% 29%, rgba(0,0,0,.18) 30% 46%, transparent 47%), radial-gradient(circle at 34% 24%, rgba(255,255,255,.28), transparent 24%), linear-gradient(145deg, rgba(255,255,255,.16), rgba(4,6,7,.9) 44%, rgba(255,255,255,.08)); box-shadow: inset 0 2px 10px rgba(255,255,255,.18), inset 0 -13px 22px rgba(0,0,0,.58), 0 5px 17px rgba(0,0,0,.46); cursor: grab; appearance: none; touch-action: none; transform: translate(-50%, -50%) scale(.96); }
      .light::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.2), rgba(255,255,255,.04) 42%, rgba(0,0,0,.1) 78%); }
      .light::after { content: ""; position: absolute; inset: -13px; border-radius: 50%; background: var(--beam, transparent); opacity: var(--beam-opacity, 0); filter: blur(7px); z-index: -1; }
      .light.active { transform: translate(-50%, -50%) scale(1.05); }
      .light.manual { border-color: rgba(255,255,255,.7); }
      .light.blackout { border-color: rgba(255,255,255,.16); background: radial-gradient(circle at 50% 48%, rgba(255,255,255,.12) 0 8%, rgba(255,255,255,.03) 9% 28%, rgba(0,0,0,.6) 29% 64%, rgba(0,0,0,.92) 65%), linear-gradient(145deg, rgba(255,255,255,.11), rgba(0,0,0,.95) 48%, rgba(255,255,255,.05)); box-shadow: inset 0 2px 10px rgba(255,255,255,.12), inset 0 -13px 22px rgba(0,0,0,.72), 0 5px 17px rgba(0,0,0,.46) !important; }
      .light.phase-split::before { inset: 10px; border-radius: 50%; background: linear-gradient(90deg, var(--phase-left, rgba(0,0,0,.96)) 0 50%, var(--phase-right, rgba(0,0,0,.96)) 50% 100%); opacity: 1; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 0 12px rgba(0,0,0,.5); }
      .phase-button { position: absolute; top: 50%; z-index: 3; display: none; width: 16px; min-height: 16px; height: 16px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.36); background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.58), rgba(255,255,255,.05) 42%, rgba(79,195,177,.62) 74%), #1d2a2c; box-shadow: inset 0 1px 4px rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.46); cursor: pointer; transform: translateY(-50%); }
      .is-training-edit .phase-button { display: block; }
      .phase-button-first { left: -8px; }
      .phase-button-second { right: -8px; }
      .phase-button.is-off { border-color: rgba(255,255,255,.18); background: radial-gradient(circle at 38% 28%, rgba(255,255,255,.22), rgba(255,255,255,.02) 40%, rgba(0,0,0,.92) 76%), #030505; box-shadow: inset 0 1px 5px rgba(255,255,255,.08), 0 1px 5px rgba(0,0,0,.54); }
      .light-label { position: absolute; left: 50%; top: calc(100% + 5px); display: none; width: 84px; transform: translateX(-50%); color: rgba(237,242,244,.8); font-size: 9px; line-height: 1.05; text-align: center; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
      .is-training-edit .light-label { display: block; }
      .is-training-edit .light { outline: 1px solid rgba(79,195,177,.45); outline-offset: 4px; }
      .source-timeline-control, .device-control, .audio-device-summary-control { display: none !important; }
      .mode-timeline .source-file-control, .is-mic-mode .source-file-panel, .is-mic-mode .source-file-control, .is-mic-mode .source-timeline-control { display: none !important; }
      .output-timeline .source-timeline-control { display: flex !important; }
      .output-timeline .source-file-control { display: none !important; }
      .is-mic-mode .device-control { display: none !important; }
      .is-mic-mode .audio-device-summary-control { display: grid !important; }
      .mini-player .live-spectrum { height: 132px; margin: 0; cursor: pointer; }
      @media (max-width: 860px) { .topbar { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px 14px 10px; } .tester-layout { display: block; } .controls { justify-content: flex-start; margin-top: 0; } label, .file-control { flex: 1 1 calc((100% - 30px) / 4); min-width: 118px; width: auto; } .file-control { flex-basis: calc((100% - 30px) / 4); } .transport { flex: 0 0 156px; } .training-switch { flex: 0 0 78px; min-width: 78px; width: 78px; } .training-duration-control { flex: 0 0 96px; min-width: 96px; } .audio-device-summary-control { flex: 1 1 180px; min-width: 160px; } .sample-control { flex: 1 1 220px; } .range-control { flex: 1 1 180px; } .number-control { flex: 0 0 92px; } .mini-player { margin-top: 0; } .meter-panel { border-right: 0; border-bottom: 1px solid var(--line); } .stage-panel { padding: 14px; gap: 8px; } }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Controls">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Lighting Brain</h1>
            <p id="trackLabel">No track loaded</p>
          </div>
        </div>

        <div class="controls">
          <label>
            <span>Input</span>
            <select id="inputSource">
              <option value="system_audio" selected>Audio Device</option>
              <option value="file">Load file</option>
              <option value="mic_device">Mic Device</option>
              <option value="rekordbox" disabled>Rekordbox</option>
              <option value="spotify" disabled>Spotify</option>
            </select>
          </label>

          <div class="transport">
            <button id="playButton" type="button" disabled>Play</button>
            <button id="stopButton" type="button" disabled>Stop</button>
          </div>

          <label class="training-switch">
            <span>Training</span>
            <input id="trainingMode" type="checkbox">
          </label>

          <label class="training-duration-control">
            <span>Train time</span>
            <select id="trainingDuration">
              <option value="10">10s</option>
              <option value="30" selected>30s</option>
              <option value="60">1m</option>
              <option value="180">3m</option>
            </select>
          </label>

          <label class="file-control source-file-control">
            <span>Load audio</span>
            <input id="audioFile" type="file" accept="audio/*">
          </label>

          <label class="file-control source-timeline-control">
            <span>Load timeline</span>
            <input id="timelineFile" type="file" accept="application/json,.json">
          </label>

          <label class="device-control">
            <span>Device</span>
            <select id="audioDevice" disabled>
              <option value="">Default audio input</option>
            </select>
          </label>

          <label class="audio-device-summary-control">
            <span>Audio Device</span>
            <output id="audioDeviceSummary">Auto</output>
          </label>

          <label>
            <span>Output</span>
            <select id="outputTarget">
              <option value="tester">Mini tester</option>
              <option value="timeline_json">Timeline JSON</option>
              <option value="qlcplus_osc">QLC+ OSC</option>
              <option value="qlcplus_midi">QLC+ MIDI</option>
              <option value="freestyler_midi">FreeStyler MIDI</option>
              <option value="artnet_intent">Art-Net intent</option>
            </select>
          </label>

          <label>
            <span>Genre</span>
            <select id="genreProfile">
              <option value="house">House</option>
              <option value="techno">Techno</option>
              <option value="metal">Metal</option>
              <option value="electronic">Electronic</option>
              <option value="garage">Garage</option>
            </select>
          </label>

          <label class="number-control">
            <span>Lights</span>
            <input id="lightCount" type="number" min="1" max="32" value="8">
          </label>

          <label class="range-control">
            <span>Differenziazione <strong id="differentiationValue">2</strong></span>
            <input id="differentiation" type="range" min="1" max="8" value="2">
          </label>

          <label class="sample-control">
            <span>Sound / sample</span>
            <input id="sampleTagInput" list="sampleTagSuggestions" placeholder="clap_accent">
            <datalist id="sampleTagSuggestions">
              <option value="clap_accent"></option>
              <option value="kick_pulse"></option>
              <option value="snare_flash"></option>
              <option value="guitar_arpeggio_clock"></option>
              <option value="vocal_phrase"></option>
              <option value="open_hat_drive"></option>
              <option value="bassline_roll"></option>
              <option value="silence_hit"></option>
              <option value="pre_drop_countdown"></option>
              <option value="fake_drop"></option>
              <option value="melodic_breakdown"></option>
            </datalist>
          </label>
        </div>

        <div class="mini-player review-player" aria-label="Audio position">
          <span id="currentTimeLabel">0:00</span>
          <button id="reviewPlayButton" class="review-play-button" type="button" disabled aria-label="Play review">▶</button>
          <canvas id="liveSpectrum" class="live-spectrum" width="980" height="156" aria-label="Dissector lanes"></canvas>
          <input id="seekSlider" class="hidden-seek" type="range" min="0" max="1000" value="0" disabled>
          <span id="durationLabel">0:00</span>
        </div>
      </section>

      <section class="tester-layout">
        <aside class="meter-panel" aria-label="Signal meters">
          <div class="status-row">
            <span>State</span>
            <strong id="stateLabel">Idle</strong>
          </div>
          <div class="status-row">
            <span>Output</span>
            <strong id="outputLabel">Mini tester</strong>
          </div>
          <div class="status-row">
            <span>Energy</span>
            <strong id="energyLabel">0%</strong>
          </div>
          <div class="meter">
            <div id="energyFill"></div>
          </div>
          <canvas id="trackOverview" class="track-overview source-file-panel" width="520" height="132" aria-label="Track overview"></canvas>
          <section class="metadata-panel" aria-label="Current metadata">
            <h3>Current brain</h3>
            <dl>
              <div><dt>Sample</dt><dd id="currentSampleCategory">-</dd></div>
              <div><dt>Scene</dt><dd id="currentSceneCategory">-</dd></div>
              <div><dt>Intent</dt><dd id="currentIntent">-</dd></div>
              <div><dt>Gesture</dt><dd id="currentGesture">-</dd></div>
              <div><dt>Energy</dt><dd id="currentEnergyTrend">-</dd></div>
            </dl>
          </section>
          <div class="event-log" id="eventLog" aria-live="polite"></div>
        </aside>

        <section class="stage-panel" aria-label="Mini light tester">
          <div class="stage-toolbar">
            <div>
              <h2>Mini Light Tester</h2>
              <p>Drag lights to sketch a real setup</p>
            </div>
            <div class="cue-editor" aria-label="Cue editor">
              <label>
                Cue
                <input id="cueNameInput" type="text" placeholder="no cue" disabled>
              </label>
              <label>
                Prob.
                <input id="cueProbabilityInput" type="number" min="0" max="1" step="0.05" value="0.9" disabled>
              </label>
            </div>
            <div class="stage-actions">
              <button id="saveAnnotationButton" type="button">Save mark</button>
              <button id="downloadAnnotationsButton" type="button">Download</button>
              <button id="clearTrainingLightsButton" type="button">Clear lights</button>
              <button id="resetLayoutButton" type="button">Reset layout</button>
            </div>
          </div>

          <div class="training-summary" id="trainingSummary">0 marks</div>

          <div id="stage" class="stage">
            <span class="stage-label stage-label-up">up</span>
            <span class="stage-label stage-label-middle">middle</span>
            <span class="stage-label stage-label-down">down</span>
            <span class="stage-label stage-label-left">L</span>
            <span class="stage-label stage-label-right">R</span>
            <span class="stage-label stage-label-centre">centre</span>
            <div class="stage-depth depth-back"></div>
            <div class="stage-depth depth-mid"></div>
            <div class="stage-depth depth-front"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="app.js?v=20260601-2"></script>
  </body>
</html>
